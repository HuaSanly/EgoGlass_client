# HumanEgo-compatible HaMeR hand tracking on native Windows.
schema_version: "1.0"

# Relative paths are resolved from this YAML file. This directory is ignored by Git.
model_directory: ../local-data/models/hand-tracking

device: cuda
require_cuda: true
require_hamer: true
download_models: true

# HumanEgo uses YOLO + easy_ViTPose first, then MediaPipe if that detector cannot load.
detector: vitpose
fallback_detector: mediapipe
allow_mediapipe_reconstruction_fallback: true
vitpose_variant: h

detector_keypoint_confidence: 0.3
detector_min_valid_keypoints: 4
detector_bbox_padding_ratio: 0.3
# Applied to every ViTPose candidate to reject tiny or near-full-frame boxes.
detector_min_bbox_dimension_ratio: 0.05
detector_max_bbox_area_ratio: 0.35
# Current Glass3 no-hand replay: 0.3325 false positive; public true hands: >=0.721.
minimum_hand_confidence: 0.5

# HumanEgo's physical-size fallback for absolute camera-space depth.
physical_wrist_to_middle_mcp_m: 0.085
minimum_depth_m: 0.05
maximum_depth_m: 3.0
grasp_ratio_threshold: 1.0

