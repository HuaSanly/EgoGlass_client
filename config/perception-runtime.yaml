# Online and offline orchestration around the shared sensor-preprocessing and HaMeR stages.
schema_version: "1.0"
enabled: true

# HaMeR is deliberately run on one worker. When it is busy, the newest decoded
# WebRTC frame replaces older pending frames instead of delaying the media path.
max_live_inference_fps: 6.0
preview_jpeg_quality: 85

replay:
  # Render every input frame, and run the model on every fifth frame by default.
  # Frames between inference updates reuse the latest same-clip skeleton.
  inference_stride_frames: 5
