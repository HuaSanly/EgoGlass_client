# Sensor preprocessing runtime configuration.
schema_version: "1.0"

# Relative paths are resolved from this YAML file's directory.
calibration_file: sensor-calibration-640x480-sample.json

recorded:
  # Verify every MP4 against the SHA256 recorded in the session manifest.
  verify_media_hashes: true
  # FFmpeg decoder worker count. Zero lets FFmpeg select automatically.
  decode_threads: 0

image:
  undistort: true
  # nearest | linear | cubic | area | lanczos4
  interpolation: linear
  # constant | replicate | reflect | reflect_101
  border_mode: constant

live:
  # Maximum future IMU samples retained between decoded video frames.
  max_pending_imu_samples: 2048

imu_orientation:
  # Fusion tuning only. Axis mapping, bias, scale and noise remain in calibration JSON.
  madgwick_beta: 0.05
  initial_static_samples: 20
  static_gyro_threshold_rad_s: 0.05
  gravity_magnitude_m_s2: 9.80665
  gravity_tolerance_m_s2: 1.25
  quaternion_smoothing_time_constant_s: 0.025
  minimum_sample_interval_s: 0.0001
  maximum_sample_interval_s: 0.2
