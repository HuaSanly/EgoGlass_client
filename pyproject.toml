[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "egoglass-client"
version = "0.1.0"
description = "EgoGlass recording-only Windows client"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "GPL-3.0-only" }
dependencies = [
  "aiortc>=1.15,<2",
  "av>=16,<17",
  "fastapi>=0.115,<1",
  "numpy>=2,<3",
  "pyqtgraph==0.14.0",
  "PyQt6==6.8.1",
  "PyQt6-Qt6==6.8.2",
  "PyQt6-Fluent-Widgets==1.11.2",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
egoglass-client = "ui.app:main"
egoglass-ingest-gateway = "ui.gateway.app:main"
egoglass-record-imu = "ui.imu_calibration.app:main"

[tool.hatch.build.targets.wheel]
packages = [
  "ui",
  "src/schemas",
]

[tool.hatch.build]
exclude = [
  "/build",
  "/dist",
  "/local-data",
]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
