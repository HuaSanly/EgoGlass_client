[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "egoglass-client"
version = "0.1.0"
description = "EgoGlass Windows client and perception modules"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "GPL-3.0-only" }
dependencies = [
  "aiortc>=1.15,<2",
  "ahrs==0.4.0",
  "av>=16,<17",
  "fastapi>=0.115,<1",
  "numpy>=2,<3",
  "opencv-python-headless>=4.10,<5",
  "PyOpenGL==3.1.0",
  "pyqtgraph==0.14.0",
  "PyQt6==6.8.1",
  "PyQt6-Qt6==6.8.2",
  "PyQt6-Fluent-Widgets==1.11.2",
  "pydantic>=2.10,<3",
  "pyyaml>=6,<7",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
egoglass-client = "ui.app:main"
egoglass-ingest-gateway = "ingest_gateway.app:main"

[tool.hatch.build.targets.wheel]
packages = [
  "ui",
  "src/annotation",
  "src/ingest_gateway",
  "src/perception",
]

[tool.hatch.build]
exclude = [
  "/build",
  "/dist",
  "/local-data",
]

[tool.egoglass.hand-tracking]
# These packages require HumanEgo's --no-deps/special-patch install path.
hamer_revision = "3a01849f4148352e9260b69bf28b65d1671a4905"
wilor_mini_revision = "ebec42f94c389070cdd7dda6fd1bf0b4a659c960"
chumpy_version = "0.70"
setup_script = "scripts/setup_client.ps1"

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = [".", "src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
