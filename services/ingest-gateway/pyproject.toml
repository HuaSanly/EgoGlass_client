[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "egoglass-ingest-gateway"
version = "0.1.0"
description = "EgoGlass WebRTC and RTSP media ingress for Rokid Glass3"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "aiortc>=1.15,<2",
  "av>=16,<17",
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
egoglass-ingest-gateway = "egoglass_ingest_gateway.app:main"

[dependency-groups]
dev = [
  "httpx2>=2,<3",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/egoglass_ingest_gateway"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
