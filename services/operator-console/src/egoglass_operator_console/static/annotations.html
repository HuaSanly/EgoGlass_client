<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Episode 标注 · EgoGlass</title>
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <nav class="nav-rail" aria-label="主导航">
        <a class="nav-item" href="/" title="主页">
          <span class="nav-glyph" aria-hidden="true">HOME</span>
          <span>主页</span>
        </a>
        <a class="nav-item" href="/storage" title="存储">
          <span class="nav-glyph" aria-hidden="true">STORE</span>
          <span>存储</span>
        </a>
        <a class="nav-item is-active" href="/annotations" aria-current="page" title="标注">
          <span class="nav-glyph" aria-hidden="true">LABEL</span>
          <span>标注</span>
        </a>
      </nav>

      <main class="main-content annotation-main">
        <section class="annotation-shell" aria-labelledby="annotation-title">
          <header class="annotation-toolbar">
            <div class="annotation-title-block">
              <span class="eyebrow">EPISODE ANNOTATION</span>
              <h1 id="annotation-title">EgoGlass 人类操作</h1>
            </div>
            <div class="annotation-strategy-controls">
              <label class="compact-field" for="segmentation-strategy">
                <span>切分方案</span>
                <select id="segmentation-strategy">
                  <option value="manual">人工任务尝试</option>
                  <option value="clip_as_episode">整段视频</option>
                  <option value="fixed_window">固定窗口</option>
                </select>
              </label>
              <label class="compact-field fixed-window-field" for="window-duration" hidden>
                <span>窗口</span>
                <input id="window-duration" type="number" min="1" max="120" step="0.5" value="8">
              </label>
              <label class="compact-field fixed-window-field" for="window-stride" hidden>
                <span>步长</span>
                <input id="window-stride" type="number" min="1" max="120" step="0.5" value="8">
              </label>
              <button class="button button-small" id="generate-proposals-button" type="button">
                生成候选
              </button>
              <button class="button button-small annotation-accept-button" id="accept-proposals-button" type="button" hidden>
                接受候选
              </button>
            </div>
            <div class="annotation-command-bar">
              <button class="button button-icon" id="undo-annotation-button" type="button" title="撤销" aria-label="撤销" disabled>↶</button>
              <button class="button button-icon" id="redo-annotation-button" type="button" title="重做" aria-label="重做" disabled>↷</button>
              <div class="annotation-save-state" aria-live="polite">
                <span class="control-status-dot" id="annotation-save-dot" aria-hidden="true"></span>
                <span id="annotation-save-label">正在连接数据平台</span>
              </div>
              <button class="button annotation-publish-button" id="publish-annotation-button" type="button" disabled>
                发布版本
              </button>
            </div>
          </header>

          <div class="annotation-workspace">
            <aside class="annotation-session-pane" aria-labelledby="annotation-sessions-title">
              <div class="annotation-pane-header">
                <div>
                  <h2 id="annotation-sessions-title">采集会话</h2>
                  <span id="annotation-session-summary">正在读取</span>
                </div>
                <button class="button button-icon" id="refresh-annotations-button" type="button" title="刷新会话" aria-label="刷新会话">↻</button>
              </div>
              <div class="annotation-session-list" id="annotation-session-list"></div>
              <div class="annotation-empty-state" id="annotation-session-empty" hidden>
                <strong>没有可标注会话</strong>
                <span>完成一次采集后，会话会出现在这里。</span>
              </div>
            </aside>

            <section class="annotation-editor-pane" aria-label="视频和时间线编辑器">
              <header class="annotation-editor-header">
                <div>
                  <strong id="active-session-name">请选择会话</strong>
                  <span id="active-session-detail">视频和草稿尚未载入</span>
                </div>
                <label class="clip-selector" for="annotation-clip-select">
                  <span>视频片段</span>
                  <select id="annotation-clip-select" disabled></select>
                </label>
              </header>

              <div class="annotation-video-stage">
                <video id="annotation-video" preload="metadata" playsinline></video>
                <div class="annotation-video-empty" id="annotation-video-empty">
                  <strong>选择一个采集会话</strong>
                  <span>标注不会修改原始视频。</span>
                </div>
              </div>

              <div class="annotation-playback-bar">
                <button class="button button-icon" id="jump-start-button" type="button" title="跳到视频开始" aria-label="跳到视频开始" disabled>↤</button>
                <button class="button button-icon" id="previous-frame-button" type="button" title="上一帧" aria-label="上一帧" disabled>‹</button>
                <button class="button button-icon annotation-play-button" id="annotation-play-button" type="button" title="播放或暂停" aria-label="播放或暂停" disabled>▶</button>
                <button class="button button-icon" id="next-frame-button" type="button" title="下一帧" aria-label="下一帧" disabled>›</button>
                <button class="button button-icon" id="jump-end-button" type="button" title="跳到视频结尾" aria-label="跳到视频结尾" disabled>↦</button>
                <output class="annotation-timecode" id="annotation-timecode">00:00.000 · F000000</output>
                <label class="playback-rate" for="annotation-playback-rate">
                  <span>速度</span>
                  <select id="annotation-playback-rate" disabled>
                    <option value="0.25">0.25×</option>
                    <option value="0.5">0.5×</option>
                    <option value="1" selected>1×</option>
                    <option value="1.5">1.5×</option>
                    <option value="2">2×</option>
                  </select>
                </label>
              </div>

              <div class="annotation-timeline" id="annotation-timeline">
                <div class="timeline-ruler" id="timeline-ruler"></div>
                <div class="timeline-track-row">
                  <span class="timeline-track-label">EPISODE</span>
                  <div class="timeline-track" id="episode-track"></div>
                </div>
                <div class="timeline-track-row">
                  <span class="timeline-track-label">PHASE</span>
                  <div class="timeline-track phase-track" id="phase-track"></div>
                </div>
                <div class="timeline-playhead" id="timeline-playhead" hidden></div>
              </div>

              <div class="annotation-edit-bar">
                <span class="mark-readout" id="episode-mark-readout">入点未设置</span>
                <button class="button button-small" id="set-episode-in-button" type="button" disabled>设置入点</button>
                <button class="button button-small" id="create-episode-button" type="button" disabled>创建 Episode</button>
                <button class="button button-small" id="split-episode-button" type="button" disabled>在播放头分割</button>
                <button class="button button-small" id="merge-episode-button" type="button" disabled>合并下一段</button>
                <button class="button button-small annotation-delete-button" id="delete-episode-button" type="button" disabled>删除</button>
              </div>
            </section>

            <aside class="annotation-inspector-pane" aria-labelledby="annotation-inspector-title">
              <div class="annotation-pane-header">
                <div>
                  <h2 id="annotation-inspector-title">标签检查器</h2>
                  <span id="selected-episode-summary">未选择 Episode</span>
                </div>
              </div>
              <div class="annotation-inspector-empty" id="annotation-inspector-empty">
                <strong>选择一个 Episode</strong>
                <span>可编辑任务标签并添加内部动作阶段。</span>
              </div>
              <form class="annotation-inspector-form" id="annotation-inspector-form" hidden>
                <fieldset class="annotation-fieldset">
                  <legend>任务标签</legend>
                  <label><span>任务编号</span><input id="label-task-id" type="text" maxlength="128" placeholder="可选"></label>
                  <label><span>任务描述</span><textarea id="label-instruction" maxlength="512" rows="2" required></textarea></label>
                  <div class="annotation-field-grid">
                    <label><span>动作</span><input id="label-verb" type="text" maxlength="128" required></label>
                    <label><span>对象</span><input id="label-object" type="text" maxlength="128" required></label>
                  </div>
                  <label><span>目标</span><input id="label-target" type="text" maxlength="128" placeholder="可选"></label>
                  <div class="annotation-field-grid">
                    <label><span>参与手</span><select id="label-hand"><option value="unspecified">未标注</option><option value="left">左手</option><option value="right">右手</option><option value="both">双手</option><option value="none">无手部操作</option></select></label>
                    <label><span>结果</span><select id="label-outcome"><option value="unreviewed">未检查</option><option value="success">成功</option><option value="failure">失败</option><option value="interrupted">中断</option><option value="invalid">无效</option></select></label>
                  </div>
                  <div class="quality-flag-group" id="quality-flag-group">
                    <span>质量标记</span>
                    <label><input type="checkbox" value="blurred">模糊</label>
                    <label><input type="checkbox" value="occluded">遮挡</label>
                    <label><input type="checkbox" value="excessive_camera_motion">相机剧烈运动</label>
                    <label><input type="checkbox" value="incomplete_action">动作不完整</label>
                    <label><input type="checkbox" value="metadata_gap">帧 metadata 缺失</label>
                  </div>
                  <label><span>备注</span><textarea id="label-notes" maxlength="2000" rows="2"></textarea></label>
                </fieldset>

                <fieldset class="annotation-fieldset phase-editor">
                  <legend>内部阶段</legend>
                  <div class="phase-list" id="phase-list"></div>
                  <span class="mark-readout" id="phase-mark-readout">阶段入点未设置</span>
                  <div class="annotation-field-grid">
                    <label><span>阶段</span><select id="phase-kind"><option value="prepare">准备</option><option value="approach">接近</option><option value="contact">接触</option><option value="manipulate">操作</option><option value="release">释放</option><option value="complete">完成</option><option value="other">其他</option></select></label>
                    <label><span>参与手</span><select id="phase-hand"><option value="unspecified">未标注</option><option value="left">左手</option><option value="right">右手</option><option value="both">双手</option><option value="none">无</option></select></label>
                  </div>
                  <div class="annotation-field-grid">
                    <label><span>动作</span><input id="phase-verb" type="text" maxlength="128"></label>
                    <label><span>对象</span><input id="phase-object" type="text" maxlength="128"></label>
                  </div>
                  <div class="phase-command-row">
                    <button class="button button-small" id="set-phase-in-button" type="button">设置阶段入点</button>
                    <button class="button button-small" id="create-phase-button" type="button">添加阶段</button>
                  </div>
                </fieldset>
              </form>
            </aside>
          </div>

          <div class="annotation-message" id="annotation-message" role="status" aria-live="polite" hidden></div>
        </section>
      </main>
    </div>
    <script type="module" src="/assets/annotations.js"></script>
  </body>
</html>
