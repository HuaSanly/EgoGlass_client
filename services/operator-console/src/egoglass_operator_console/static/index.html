<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>EgoGlass Operator Console</title>
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <nav class="nav-rail" aria-label="主导航">
        <a class="nav-item is-active" href="/" aria-current="page" title="主页">
          <span class="nav-glyph" aria-hidden="true">HOME</span>
          <span>主页</span>
        </a>
      </nav>

      <main class="main-content">
        <section class="workspace" aria-label="Glass3 实时视频">
          <section class="viewer-tool" aria-labelledby="viewer-title">
            <div class="tool-header">
              <div>
                <span class="eyebrow">GLASS3 LIVE SOURCE</span>
                <h1 id="viewer-title">第一视角视频</h1>
              </div>
              <div class="viewer-header-actions">
                <div class="connection-summary" aria-live="polite">
                  <span class="status-light" id="connection-light" aria-hidden="true"></span>
                  <div>
                    <strong id="connection-label">等待 Glass3 视频</strong>
                    <span>DIRECT WEBRTC</span>
                  </div>
                </div>
                <button class="button button-small" id="fullscreen-button" type="button">
                  全屏
                </button>
              </div>
            </div>

            <div class="viewer-stage" id="viewer-stage">
              <video
                id="live-video-source"
                class="live-video-source"
                aria-label="Glass3 实时第一视角视频"
                autoplay
                muted
                playsinline
              ></video>
              <div class="viewer-badges">
                <span class="badge" id="live-badge">
                  <span class="badge-dot" aria-hidden="true"></span>
                  <span id="live-badge-label">WAITING</span>
                </span>
                <span class="badge" id="resolution-badge">等待画面</span>
              </div>
              <div class="viewer-empty" id="viewer-empty">
                <span class="waiting-mark" aria-hidden="true"></span>
                <strong>等待 Glass3 首帧</strong>
                <span>接收网关已就绪后，画面会自动出现</span>
              </div>
            </div>

            <div class="viewer-footer">
              <div>
                <span>最近画面</span>
                <strong id="last-frame-time">--</strong>
              </div>
              <div>
                <span>显示帧率</span>
                <strong id="preview-fps">--</strong>
              </div>
            </div>
          </section>

          <aside class="right-column" aria-label="运行状态和事件">
            <section class="signal-tool" aria-labelledby="signal-title">
              <div class="tool-header compact-header">
                <div>
                  <span class="eyebrow">MEDIA LINK</span>
                  <h2 id="signal-title">信号链路</h2>
                </div>
                <span class="pill" id="source-pill">等待首帧</span>
              </div>

              <dl class="property-list">
                <div><dt>媒体源</dt><dd>Rokid Glass3 相机</dd></div>
                <div><dt>传输</dt><dd>WebRTC / DTLS-SRTP</dd></div>
                <div><dt>编解码</dt><dd>H.264</dd></div>
                <div><dt>预览状态</dt><dd id="preview-status-property">等待首帧</dd></div>
                <div><dt>画面尺寸</dt><dd id="frame-size-property">--</dd></div>
                <div><dt>接收网关</dt><dd>127.0.0.1:8770</dd></div>
              </dl>

              <section class="stream-control" aria-labelledby="stream-control-title">
                <div class="stream-control-summary">
                  <span class="control-status-dot" id="control-status-dot" aria-hidden="true"></span>
                  <div>
                    <strong id="stream-control-title">视频流控制</strong>
                    <span id="stream-control-status" aria-live="polite">正在检查控制通路</span>
                  </div>
                </div>
                <div class="stream-control-actions" role="group" aria-label="视频流控制">
                  <button
                    class="button stream-control-button stream-control-start"
                    id="start-stream-button"
                    type="button"
                    title="开始眼镜端视频流"
                    disabled
                  >
                    <span aria-hidden="true">▶</span>
                    开始视频
                  </button>
                  <button
                    class="button stream-control-button stream-control-stop"
                    id="stop-stream-button"
                    type="button"
                    title="停止眼镜端视频流"
                    disabled
                  >
                    <span aria-hidden="true">■</span>
                    停止视频
                  </button>
                </div>
                <p class="control-error" id="control-error" role="status" hidden></p>
              </section>
            </section>

            <section class="event-tool" aria-labelledby="event-title">
              <div class="tool-header compact-header">
                <div>
                  <span class="eyebrow">CLIENT EVENTS</span>
                  <h2 id="event-title">事件记录</h2>
                </div>
                <button class="button button-small" id="clear-events-button" type="button">
                  清空
                </button>
              </div>
              <div class="event-table-wrap">
                <table class="event-table">
                  <colgroup>
                    <col class="event-time-column">
                    <col class="event-level-column">
                    <col class="event-message-column">
                  </colgroup>
                  <thead><tr><th>时间</th><th>级别</th><th>事件</th></tr></thead>
                  <tbody id="event-rows"></tbody>
                </table>
              </div>
            </section>
          </aside>
        </section>
      </main>
    </div>

    <script src="/assets/app.js" defer></script>
  </body>
</html>
